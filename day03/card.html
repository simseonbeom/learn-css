<!DOCTYPE html>
<html lang="ko-KR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Card 컴포넌트 실습</title>
  <link rel="stylesheet" href="../reset.css"/>
  <link rel="stylesheet" href="./style/card.css"/>
</head>
<body>

<main class="profile">
  <article class="profile-card">
    <img class="profile-image" src="./assets/mozzi.png" alt="요염한 자세를 하고있는 모찌" />
    <div class="profile-content">
      <h1 class="profile-name">임모찌</h1>
      <p class="profile-job">프론트엔드 개발 수강생</p>
      <p class="profile-description">
        접근하기 쉽고 사용하기 편한 웹페이지를 만드는 개발자가 되고 싶습니다.
      </p>
      <a class="profile-link" href="mailto:haneul@example.com">이메일 보내기</a>
    </div>
  </article>
</main>
  
</body>
</html>
