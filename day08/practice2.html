<!DOCTYPE html>
<html lang="ko-KR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

  <main>
    <section>
      <div>
        <div>
          <div>
            <span>신청 가능</span>
            <span>Frontend Study #03</span>
          </div>

          <h1>Bootstrap 실전 스터디</h1>

          <p>
            Bootstrap의 Grid, Utility, Component를 활용해 반응형 웹 UI를 함께
            제작하는 오프라인 스터디입니다.
          </p>

          <div class="list-group">
            <div class="list-group-item">
              <span>일정</span>
              <strong>9월 12일 토요일 · 14:00</strong>
            </div>

            <div>
              <span>장소</span>
              <strong>강남 스터디룸 A</strong>
            </div>

            <div>
              <span>진행 시간</span>
              <strong>약 2시간</strong>
            </div>
          </div>

          <div>
            <span>Grid</span>
            <span>Utility</span>
            <span>Responsive</span>
          </div>
        </div>

        <div>
          <div>
            <p>현재 신청 인원</p>

            <div>
              <strong>18명</strong>
              <span>/ 24명</span>
            </div>

            <div
              role="progressbar"
              aria-label="스터디 신청 현황"
              aria-valuenow="75"
              aria-valuemin="0"
              aria-valuemax="100"
            >
              <div style="width: 75%">75%</div>
            </div>

            <div>남은 자리가 많지 않습니다.</div>

            <a href="#">스터디 참가 신청</a>
          </div>
        </div>
      </div>
    </section>
  </main>


  
</body>
</html>
