<!doctype html>
<html lang="ko-KR">
  <head>
    <title>Document</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./dist/output.css" />
  </head>
  <body class="">
     <main>
      <header>
        <p> Tailwind CSS · Practice 01 </p>

        <h1>Movie Card</h1>

        <p>
          이미지, 오버레이, absolute positioning, group-hover, transition을 활용해
          스트리밍 서비스 스타일의 콘텐츠 카드를 만들어봅니다.
        </p>
      </header>

      <section>
        <article>
          <img
            src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=900&q=85"
            alt="밤하늘과 산을 배경으로 한 콘텐츠 이미지"
          />
          <div></div>    <!-- 이미지에 어두운 배경 처리 -->

          <div>
            <span>Top 10</span>
            <span>15+</span>
          </div>

          <button type="button" aria-label="재생"> ▶ </button>

          <div>
            <p>Original Series</p>

            <h2>NIGHTFALL</h2>

            <div>
              <span>98% 일치</span>
              <span>2026</span>
              <span>HD</span>
            </div>

            <p> 모든 빛이 사라진 도시에서 마지막 신호를 따라가는 세 사람의 미스터리 스릴러. </p>

            <div>
              <button type="button"> ▶ 재생 </button>

              <button type="button" aria-label="내가 찜한 콘텐츠에 추가"> + </button>
            </div>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
